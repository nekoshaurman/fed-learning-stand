[experiment]
name = "mnist-smoke"
target_accuracy = 0.1

[dataset]
name = "mnist"
data_dir = "./data"
download = true
num_workers = 0

[partition]
type = "dirichlet"
num_clients = 2
alpha = 0.5
classes_per_client = 2
min_partition_size = 10
quantity_alpha = 0.5
seed = 123

[model]
name = "mnist-cnn"
num_classes = 10

[training]
batch_size = 16
local_epochs = 1
learning_rate = 0.01
momentum = 0.0
weight_decay = 0.0
device = "cpu"
seed = 123

[federation]
num_rounds = 1
fraction_train = 1.0
fraction_evaluate = 1.0
min_available_clients = 2
min_train_clients = 2
min_evaluate_clients = 2

[strategy]
name = "fedavg"
server_learning_rate = 1.0
server_momentum = 0.0
proximal_mu = 0.0
accept_failures = true

[tracking]
output_dir = "./results"
save_client_metrics = true
save_model = false
experiment_name = "mnist-smoke"
