[experiment]
name = "mnist-iid-baseline"
target_accuracy = 0.90

[dataset]
name = "mnist"
data_dir = "./data"
download = true
num_workers = 0

[partition]
type = "iid"
num_clients = 10
alpha = 0.5
classes_per_client = 2
min_partition_size = 20
quantity_alpha = 0.5
seed = 42

[model]
name = "mnist-cnn"
num_classes = 10

[training]
batch_size = 32
local_epochs = 1
learning_rate = 0.01
momentum = 0.9
weight_decay = 0.0
device = "cpu"
seed = 42

[federation]
num_rounds = 5
fraction_train = 1.0
fraction_evaluate = 1.0
min_available_clients = 10
min_train_clients = 10
min_evaluate_clients = 10

[strategy]
name = "fedavg"
server_learning_rate = 1.0
server_momentum = 0.0
proximal_mu = 0.0
accept_failures = true

[attack]
enabled = false
type = "none"
malicious_fraction = 0.0
poison_fraction = 0.0
source_label = 1
target_label = 7
seed = 42

[tracking]
output_dir = "./results"
save_client_metrics = true
save_model = true
experiment_name = "mnist-iid-baseline"
