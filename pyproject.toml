[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flower-noniid-benchmark"
version = "0.1.0"
description = "Educational benchmark for Flower federated learning on IID and Non-IID image data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "flower-noniid-benchmark contributors" }]
dependencies = [
  "flwr>=1.10,<2.0",
  "flwr-datasets>=0.5,<1.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<4.0",
  "matplotlib>=3.8,<4.0",
  "scikit-learn>=1.4,<2.0",
  "ipykernel>=6.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "jupyterlab>=4.0,<5.0",
  "ipykernel>=6.0,<7.0",
]

[project.scripts]
fl-benchmark-run = "scripts.run_experiment:main"
fl-benchmark-grid = "scripts.run_grid:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fl_benchmark"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "fl_benchmark.server_app:app"
clientapp = "fl_benchmark.client_app:app"
